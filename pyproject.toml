[project]
name = "full-stack-ml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ui = [
    "dagshub>=0.3.46",
    "fastapi>=0.115.6",
    "mangum>=0.19.0",
    "mlflow>=2.18.0",
    "requests>=2.32.3",
    "torch>=2.5.1",
    "torchvision>=0.20.1",
]
app = [
    "aws-cdk-lib>=2.172.0",
    "constructs>=10.4.2",
]
test = [
    "pre-commit>=4.0.1",
    "pytest>=8.3.4",
    "requests>=2.32.3",
]
dev = [
    "ipykernel>=6.29.5",
    "kaggle>=1.6.17",
    "nbconvert>=7.16.4",
    "pathspec>=0.12.1",
    "ruff>=0.8.2",
]
train = [
    "lightning>=2.4.0",
    "mlflow>=2.18.0",
    "torch>=2.5.1",
    "torchvision>=0.20.1",
]
validate-deployment = [
    "boto3>=1.35.78",
    "requests>=2.32.3",
]



[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true


[tool.ruff]
select = [
    "A", # Pyflakes: general checks
    "B", # pycodestyle: pycodestyle checks
    "C", # mccabe: complexity checks
    # "D",  # pydocstyle: docstring style checks
    "E",  # pycodestyle: pycodestyle errors
    "F",  # pyflakes: unused imports, variables, etc.
    "I",  # isort: import sorting
    "N",  # pep8-naming: naming conventions
    "S",  # bandit: security checks
    "W",  # pycodestyle: pycodestyle warnings
    "UP", # pyupgrade: upgrade python version syntax
]

ignore = [
    "S101", # Ignore use of assert detected
    "S108", # ignore use of tmp
    "S311", # Standard pseudo-random generators are not suitable for cryptographic purposes
]
fix = true
